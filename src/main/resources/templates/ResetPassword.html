<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Reset Password - VakaPo</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/Login.css}">
    <link rel="stylesheet" th:href="@{/css/shared/notifications.css}">
    <style>
        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .error-message:empty {
            display: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #528CD7;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }
        
        .strength-weak { color: #dc3545; }
        .strength-medium { color: #ffc107; }
        .strength-strong { color: #28a745; }
    </style>
</head>

<body>
    <!-- Reset Password Section -->
    <div class="login">
        <div class="login__section1">
            <h1>🔑 Reset Password</h1>
            <p>Enter your new password below.</p>
        </div>
        
        <!-- Success/Error Messages -->
        <div th:if="${successMessage}" class="success-message">
            <span>✅</span>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="error-message">
            <span>❌</span>
            <span th:text="${errorMessage}"></span>
        </div>
        
        <div class="login__section2">
            <form th:action="@{/reset-password}" method="post" id="resetPasswordForm" novalidate>
                <input type="hidden" name="token" th:value="${token}">
                
                <div class="login__input">
                    <label for="newPassword">New Password <span style="color: red;">*</span></label>
                    <input type="password" id="newPassword" name="newPassword" 
                           title="Password must be at least 8 characters long"
                           placeholder="Enter your new password"
                           required>
                    <div class="error-message" id="password-error" style="color: red; font-size: 12px; margin-top: 5px; background: none; border: none; padding: 0;"></div>
                    <div class="password-strength" id="password-strength"></div>
                </div>
                
                <div class="login__input">
                    <label for="confirmPassword">Confirm Password <span style="color: red;">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" 
                           title="Please confirm your new password"
                           placeholder="Confirm your new password"
                           required>
                    <div class="error-message" id="confirm-error" style="color: red; font-size: 12px; margin-top: 5px; background: none; border: none; padding: 0;"></div>
                </div>
                
                <button type="submit" id="submitBtn">🔄 Reset Password</button>
            </form>
            
            <div class="loading" id="loadingDiv">
                <div class="spinner"></div>
                <p>Updating password...</p>
            </div>
        </div>
        
        <div class="login__section3">
            <p><a th:href="@{/login}">← Back to Login</a></p>
        </div>
    </div>

    <script>
        // Password strength checker
        function checkPasswordStrength(password) {
            const strengthDiv = document.getElementById('password-strength');
            let strength = 0;
            let message = '';
            
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            if (strength < 2) {
                message = 'Weak password';
                strengthDiv.className = 'password-strength strength-weak';
            } else if (strength < 4) {
                message = 'Medium strength password';
                strengthDiv.className = 'password-strength strength-medium';
            } else {
                message = 'Strong password';
                strengthDiv.className = 'password-strength strength-strong';
            }
            
            strengthDiv.textContent = message;
        }
        
        // Form validation
        document.getElementById('resetPasswordForm').addEventListener('submit', function(e) {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const passwordError = document.getElementById('password-error');
            const confirmError = document.getElementById('confirm-error');
            const submitBtn = document.getElementById('submitBtn');
            const loadingDiv = document.getElementById('loadingDiv');
            
            // Clear previous errors
            passwordError.textContent = '';
            confirmError.textContent = '';
            
            let hasErrors = false;
            
            // Validate new password
            if (!newPassword || newPassword.length < 8) {
                passwordError.textContent = 'Password must be at least 8 characters long';
                hasErrors = true;
            }
            
            // Validate password confirmation
            if (!confirmPassword) {
                confirmError.textContent = 'Please confirm your password';
                hasErrors = true;
            } else if (newPassword !== confirmPassword) {
                confirmError.textContent = 'Passwords do not match';
                hasErrors = true;
            }
            
            if (hasErrors) {
                e.preventDefault();
                return;
            }
            
            // Show loading state
            submitBtn.style.display = 'none';
            loadingDiv.style.display = 'block';
            
            // Form will submit normally after validation
        });
        
        // Real-time password strength checking
        document.getElementById('newPassword').addEventListener('input', function() {
            const password = this.value;
            if (password.length > 0) {
                checkPasswordStrength(password);
            } else {
                document.getElementById('password-strength').textContent = '';
                document.getElementById('password-strength').className = 'password-strength';
            }
        });
        
        // Clear error messages when user starts typing
        document.getElementById('newPassword').addEventListener('input', function() {
            document.getElementById('password-error').textContent = '';
        });
        
        document.getElementById('confirmPassword').addEventListener('input', function() {
            document.getElementById('confirm-error').textContent = '';
        });
    </script>
</body>
</html>
